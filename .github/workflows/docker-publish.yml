name: 构建并推送镜像到 GHCR

# 触发时机：
#   - 推送形如 V1.4.3 / v1.4.3 / V1.4.3-beta 的 tag 时自动构建发布
#   - 也可在 Actions 页面手动触发（workflow_dispatch）
#
# Beta 与正式版互不干扰：
#   - tag 含 beta（如 V1.4.3-beta）→ 镜像打 :V1.4.3-beta 和移动标签 :beta
#   - 正式 tag（如 V1.4.3）        → 镜像打 :V1.4.3 和 :latest
on:
  push:
    branches:
      - main
    tags:
      - 'V*'
      - 'v*'
  workflow_dispatch:

env:
  # 镜像名固定为 ghcr.io/<owner>/jav-search，owner 会自动转小写
  IMAGE: ghcr.io/${{ github.repository_owner }}/jav-search

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 构建正式 tag 时同步创建 GitHub Release
      packages: write          # 推送到 GHCR 需要 packages 写权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # owner 可能含大写，GHCR 镜像名必须全小写，这里统一转换
      - name: 计算小写镜像名
        id: img
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: 配置 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 内置令牌，无需额外配置

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # 关键：关掉 metadata-action 的自动 latest（默认 latest=auto 会对任意 git tag
          # 自动补 :latest，从而盖过下面显式的 enable=false——这正是 beta 误覆盖 :latest 的根因）。
          # 关掉后，:latest 完全由下面那条显式规则控制。
          flavor: |
            latest=false
          # 始终打上「具体版本号」标签（取自 git tag）
          # beta tag 额外打移动标签 :beta（不动 :latest）；正式 tag 才额外打 :latest
          # latest 仅允许正式版本 tag 推进，main 分支构建不能覆盖它。
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=beta,enable=${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta')) }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAV_SEARCH_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.4.6.22' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 正式版本强制同步 latest 标签
        if: startsWith(github.ref, 'refs/tags/') && !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta'))
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.img.outputs.name }}:latest" \
            "${{ steps.img.outputs.name }}:${{ github.ref_name }}"

  release:
    name: 同步 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Find curated release notes
        id: notes
        shell: bash
        run: |
          notes_path="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_path" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$notes_path" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建或更新 Release
        if: steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta') }}
          make_latest: ${{ !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta')) }}

      - name: 创建或更新 Release（无版本说明时）
        if: steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta') }}
          make_latest: ${{ !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta')) }}
