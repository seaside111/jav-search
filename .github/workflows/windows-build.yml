name: Windows desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            windows/requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r windows\requirements-build.txt

      - name: Prepare verified ffprobe
        shell: powershell
        run: .\windows\prepare-tools.ps1

      - name: Install verified Inno Setup
        shell: powershell
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe'
          $target = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          curl.exe -L --fail --retry 3 --output $target $url
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $target
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Inno Setup Authenticode verification failed.'
          }
          $process = Start-Process -FilePath $target -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }

      - name: Test, freeze and build installer
        shell: powershell
        run: .\windows\build.ps1 -Installer

      - name: Frozen application smoke test
        shell: powershell
        run: |
          $env:CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'jav-search-smoke'
          $process = Start-Process -FilePath '.\dist-release\JAV Search\JAV Search.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Frozen smoke test failed: $($process.ExitCode)" }

      - name: Verify release checksum
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = ".\dist-release\installer\JAV-Search-v$version-Windows-x64-Setup.exe"
          $checksum = "$installer.sha256"
          $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Installer checksum mismatch.' }

      - uses: actions/upload-artifact@v4
        with:
          name: jav-search-windows-x64
          path: |
            dist-release/installer/*.exe
            dist-release/installer/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jav-search-windows-x64
          path: release-assets
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes --title "JAV Search ${GITHUB_REF_NAME}"
